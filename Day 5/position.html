<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position in Css</title>
    <style>
      .container {
        border: 2px solid black;
        box-shadow: 10px 10px 10px red;
      }

      .box {
        width:70%;
        height:100px;
        background-color: aqua;
        border: 3px solid;
        margin: 10px auto;
      }
      .box1 {
        position: sticky;
      }
      /* .box2 {
        background-color: bisque;
        top: 10px;
        position: relative;
        top: -10px;
        left: -40px;
      } */

      /* .box2 {
        background-color: bisque;
        top: 10px;
        position: absolute;
        top: 0;
        left: 0;
      } */
        .box2 {
        background-color:cadetblue;
        height: 100vh;
      }

      .box3 {
        background-color: blueviolet;
      }
    </style>
  </head>
  <body>
    <!--
    Position types:
    relative
    absolute
    fixed
    sticky
    -->
    <div class="container">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
    </div>
  </body>
</html>
