<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodmandu: Food Delivery Service</title>
    <link rel="stylesheet" href="foodmandu.css">
</head>
<body>
    <header>
        <nav>
            <img src="/images/logo-n.png" alt="">
            <button>Login</button>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>
                Order Food from the widest range of restaurants.
            </h1>

            <div class="maintext">
                <input type="text" value="Restaurant or Cuisine (leave it blank to browse a)">
                <button>Find Restaurants</button>
            </div>
        </section>
        <section class="order">
            <h6>FOODMANDU FRESH</h6>
            <img src="/images/order.jpg" alt="">
        </section>
        <section class="items">
            <h6>FEATURED RESTAURANTS</h6>
            <div class="box box1"><img src="/images/pizza.png" alt=""></div>
            <div class="box box2"><img src="/images/pizza-thamel.png" alt=""></div>
            <div class="box box3"><img src="/images/bhakundo.jpg" alt=""></div>
            <div class="box box5"><img src="/images/jhamsikhel.png" alt=""></div>
            <div class="box box4"><img src="/images/burger.png" alt=""></div>
            <div class="box box6"><img src="/images/koto.png" alt=""></div>
            <div class="box box7"><img src="/images/kathmandu.jpg" alt=""></div>
            <div class="box box8"><img src="/images/kamaladi.jpg" alt=""></div>
        </section>
    </main>
</body>
</html>
