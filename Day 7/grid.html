<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in CSS</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            width: 100%;
            grid-template-columns: 1fr 1fr 1fr;
            /* grid-template-rows: 150px 100px; */
        }

        .box {
            width: 50px;
            height: 50px;
            background-color: red;
            margin: 5px;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
