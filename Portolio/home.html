<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/Portolio/iconpor.png" />
    <title>Nischal Portfolio</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Header */
      header {
        background-color: #e1e9eb;
        color: #6b5f5f;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
      }

      /* Navigation */
      nav ul {
        margin: 0;
        padding: 0;
        display: flex;
        gap: 20px;
      }

      nav ul li {
        display: flex;
        align-items: center;
      }

      nav ul li a {
        color: #6b5f5f;
        text-decoration: none;
        text-transform: uppercase;
        margin-right: 20px;
      }

      nav ul li a:hover {
        text-decoration: underline;
      }

      /* Search */
      input[type="text"] {
        width: 130px;
        padding: 8px 10px;
        border: 1px solid #aaa;
        border-radius: 5px;
        transition: width 0.4s ease-in-out;
      }

      input[type="text"]:focus {
        width: 200px;
        outline: none;
      }

      /* Home */
      #home {
        background-color: #f0f0f0;
        padding: 50px;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="/Portolio/home.html">Home</a></li>
          <li><a href="/Portolio/projects.html">Projects</a></li>
          <li><a href="/Portolio/about.html">About</a></li>
          <li><a href="/Portolio/contact.html">Contact</a></li>
          <input type="text" name="search" placeholder="Search..." />
        </ul>
      </nav>
      </div>
      <h1>Nischal Portfolio</h1>
    </header>

    <main>
      <section id="home">
        <h2>Welcome to My Portfolio</h2>
        <p>
          Hello, I'm Nischal. I'm a web developer passionate about creating
          beautiful and functional websites.
        </p>
      </section>
    </main>
  </body>
</html>
