<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="button" value ="Submit">
        <input type="checkbox" name="checkbox" id="checkbox">
        <label for="checkbox">Check me</label>
        <input type="color" name="color" id="color">
        <input type="date" name="date" id="date">
        <input type="datetime-local" name="datetime-local" id="datetime-local">
        <input type="email" name="email" id="email">
        <label for="file">Choose a file:</label>
        <input type="file" name="file" id="file">

        <label for="hidden">Hidden Input:</label>
        <input type="hidden" name="hidden" id="hidden">

        <label for="image">Choose an image:</label>
        <input type="image" name="image" id="image" src="image.jpg" alt="Image">

        <label for="month">Choose a month:</label>
        <input type="month" name="month" id="month">

        <label for="number">Enter a number:</label>
        <input type="number" name="number" id="number">

        <label for="password">Enter a password:</label>
        <input type="password" name="password" id="password">

        <label for="radio">Choose an option:</label>
        <input type="radio" name="radio" id="option1" value="option1">
        <label for="option1">Option 1</label>
        <input type="radio" name="radio" id="option2" value="option2">
        <label for="option2">Option 2</label>


        <label for="range">Choose a range:</label>
        <input type="range" name="range" id="range" min="0" max="100">

        <label for="reset">Reset Form:</label>
        <input type="reset" name="reset" id="reset">

        <label for="search">Search:</label>
        <input type="search" name="search" id="search">

        <label for="submit">Submit Form:</label>
        <input type="submit" name="submit" id="submit">

        <label for="tel" >Enter a telephone number:</label>
        <input type="tel" name="tel" id="tel">

        label for="text">Enter text:</label>
    </form>
</body>
</html>
