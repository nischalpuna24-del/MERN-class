<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File Card</title>
    <style>
        /* ==================== CSS STYLING ==================== */
        
        /* Reset basic margins and center everything on the screen */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Card layout container */
        .download-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .download-container h2 {
            color: #333333;
            margin-bottom: 10px;
        }

        .download-container p {
            color: #666666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Styled download button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none; /* Removes the underline from link */
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        }

        /* SVG icon styling */
        .download-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        /* Interactive states */
        .download-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- ==================== HTML STRUCTURE ==================== -->
    <div class="download-container">
        <h2>Your File is Ready</h2>
        <p>Click the button below to start downloading your document.</p>
        
        <!-- 
          NOTE: Replace "path/to/your/file.pdf" with your actual file path.
          Replace "custom-filename.pdf" with what you want the saved file to be named.
        -->
        <a href="path/to/your/file.pdf" download="custom-filename.pdf" class="download-btn">
            <svg class="download-icon" xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 19H20V21H4V19M13 9H18L12 15L6 9H11V3H13V9Z"/>
            </svg>
            Download File
        </a>
    </div>

</body>
</html>
