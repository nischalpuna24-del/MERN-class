<!DOCTYPE html>
<html>
<head>
    <style>
        /* Centers everything on the screen */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background: #fdfdfd;
        }
        /* Blue pill download button */
        .btn {
            background: #1e7eff;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Smooth color swap */
        }
        /* Gray progress bar container */
        .track {
            width: 320px;
            background: #e6e6e6;
            height: 30px;
            border-radius: 15px;
            position: relative;
            overflow: hidden; /* Keeps the filling rounded inside the border */
        }
        /* Blue moving indicator inside the track */
        .fill {
            height: 100%;
            width: 0%; /* Starts at 0% */
            background-color: #1e7eff;
            border-radius: 15px;
            transition: width 0.05s linear;
        }
        /* White text aligned inside the bar */
        .text {
            color: white;
            position: absolute;
            left: 15px;
            top: 6px;
            font-weight: bold;
            font-size: 14px;
            mix-blend-mode: difference; /* Makes text visible against gray and blue */
        }
    </style>
</head>
<body>

    <!-- Added id="btn" to match your JavaScript selector -->
    <button class="btn" id="btn">Downloading File</button>
    
    <div class="track">
        <!-- Added id="pro" for the filler bar element -->
        <div class="fill" id="pro"></div>
        <span class="text" id="text-pct">0%</span>
    </div>

    <script src="script.js"></script>

</body>
</html>
