<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Internal CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }

        p {
            color: blue;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- 
    1. Inline css:
    2. Internal css:
    3. External css:
    -->

    <h1 style="color: red;">This is an inline CSS example.</h1>

    <p>This is an internal CSS example.</p>

    <h2>This is an external CSS example.</h2>

    <div class="container">
        <h4>Hello this is heading 4</h4>
        <p class="pcontainer">This is a paragraph inside a div with class "container".</p>
    </div>

    <div id="uniqueDiv">
        <h4>Hello this is Unique Selector 4</h4>
    </div>

    <a href="https://www.google.com" target="_blank">Google</a>

</body>
</html>
