<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS - Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="signup-container">

        <!-- LEFT SIDE -->
        <div class="left-section">

            <div class="logo">
                LOGO
            </div>

            <div class="illustration">
                <img src="lms-illustration-crop.png" alt="LMS Illustration">
            </div>

            <div class="welcome-content">

                <h2>Welcome to LMS!</h2>

                <p>
                    Lorem Ipsum text is simply dummy text of the printing and
                    typesetting industry. Lorem Ipsum has been the industry's
                </p>

                <div class="slider">
                    <span class="dot"></span>
                    <span class="active-line"></span>
                    <span class="dot"></span>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-section">

            <div class="form-container">

                <p class="welcome-text">
                    Welcome to LMS!
                </p>

                <h1>Create Your Account</h1>


                <form>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="text"
                            id="email"
                            value="purnika prajapati"
                        >
                    </div>


                    <!-- Institution -->
                    <div class="form-group">
                        <label for="institution">
                            Institution/ Organization
                        </label>

                        <input
                            type="text"
                            id="institution"
                        >
                    </div>


                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                        >
                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                        >
                    </div>


                    <!-- Terms -->
                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            checked
                        >

                        <label for="terms">
                            I agree to
                            <a href="#">Terms of Service</a>
                            and
                            <a href="#">Privacy Policy</a>
                        </label>

                    </div>


                    <!-- Button -->
                    <button type="submit">
                        Sign Up
                    </button>

                </form>


                <p class="login-text">
                    Already have an account?
                    <a href="#">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
