<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex in Css</title>
</head>
<style>
    .box {
        height: 50px;
        width: 50px;
        background-color: red;
        margin: 10px;
        color: white;
        text-align: center;
    }
    .container {
        display: flex;
        /* justify-content: flex-end; */
        border: 3px solid red;
        height: 100vh;
        align-items: end;
    }

</style>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
