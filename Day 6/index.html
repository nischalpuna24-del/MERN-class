<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        body {
            background-color: rgb(94, 185, 101);
            margin: 0;
        }

        header {
            background-color: green;
            height: 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 50px;
        }

        ul {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
            display: inline-block;
            margin-left: 20px;
            color: white;
            font-weight: bold;
            text-transform: capitalize;
            font-size: 20px;
            cursor: pointer;
        }

        li:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
</body>
</html>
