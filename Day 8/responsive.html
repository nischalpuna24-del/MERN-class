<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Media Query Example</title>

    <style>
      .container {
        display: flex;
        gap: 10px;
      }

      .box {
        height: 100px;
        width: 100px;
        background-color: red;
      }

      /* For screens 500px or smaller */
      @media (max-width: 500px) {
        .container {
          flex-direction: column;
        }

        .box {
          background-color: blue;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      
    </div>
  </body>
</html>
