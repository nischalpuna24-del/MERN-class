<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
</head>
<style>
    .container {
        height: 100vh;
        width: 100%;
        border:  2px solid red;
    }

    .box {
        height: 100px;
        width: 100px;
        border-radius: 10px 0px;
        background-color: green;
        /* transform: rotate(120deg); */
        /* transform: rotateX(40deg); */
        /* transform: rotate(140deg); */
        /* transform: rotateX(0.5); */

        /* transform: scale(1,5); */
        /* transform: scale(1.4); */

        /* transform: skew(30deg); */
        transform: translateX(100px) translateY(50px) rotate(50deg);
    }
</style>
<body>
    <!-- rotate
    -->

    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
