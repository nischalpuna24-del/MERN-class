<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css variable</title>
    <style>

        /*Global declaration for css variable*/

        :root {
            --color: blue;
            --background-color: green;
            --p-color: purple;
        }
        .conatiner {
            height: 100vh;
            width: 100%;
            border: 2px solid black;
            background-color: var(--background-color);
        }

        .box1, .box3 {
            color: var(--color);
        }

        p {
            --acolor: red;
            color: var(--acolor);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>This is H1 tag</h1>
            <p>I am a paragraph tag</p>
        </div>
        <div class="box box2">
            <h1>This is H1 tag</h1>
            <p>I am a paragraph tag</p>
        </div>
        <div class="box3">
            <h1>This is H1 tag</h1>
            <p>I am a paragraph tag</p>
        </div>
    </div>
</body>
</html>
