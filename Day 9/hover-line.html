<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover line in html</title>
    <style>
      ul {
        display: flex;
        gap: 10px;
      }

      ul li {
        list-style: none;
        cursor: pointer;
        position: relative;
      }
      
      li {
        position: relative;
        list-style: none;
      }

      li::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 0;
        height: 2px;
        background-color: black;
        transition: width 0.3s linear;
      }

      li:hover::after {
        width: 40px;
      }
