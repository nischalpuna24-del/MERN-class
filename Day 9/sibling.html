<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        .container {
            height: 100vh;
            width: 100px;

        }

        .box {
            height: 100px;
            width: 100px;
            background-color: blue;
            margin: 5px;
        }

        .box1 ~ .box2 {
            background-color: green;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
    </div>
</body>
</html>
